name: live data

# Refreshes data/live.json once a day (GitHub contributions, repo activity,
# newsletter posts). The site reads that file when it loads.
on:
  schedule:
    - cron: "17 10 * * *"   # daily, 5:17 AM Eastern (6:17 during daylight time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/live.py
      - name: Save if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "live data: daily refresh"
          git pull --rebase --autostash origin main
          git push
